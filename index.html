function report(demo=false){state.screen='report';state.demo=demo;app.innerHTML=resultHtml(demo);window.scrollTo({top:0,behavior:'instant'});}
const SAMPLE=QUESTIONS.map((q,i)=>[[3,4,5,2,4,3][q.cat],4,5][i%3]);
function start(){if(state.done){report();return;}state.screen='quiz';quiz();window.scrollTo({top:0,behavior:'instant'});}
function advance(){advanceToken++;if(state.answers[state.idx]===null)return;if(state.idx<35){state.idx++;persist();quiz();window.scrollTo({top:0,behavior:'instant'});}else finish();}
function answer(n){if(state.done)return;state.answers[state.idx]=n;persist();quiz();const tok=++advanceToken;setTimeout(()=>{if(tok===advanceToken&&state.screen==='quiz')advance()},270);}
function wrapCanvas(ctx,text,x,y,maxWidth,lineHeight,maxLines=15){let chars=[...text];let line='';let count=0;for(let ch of chars){if(ctx.measureText(line+ch).width>maxWidth&&line){ctx.fillText(line,x,y);line=ch;y+=lineHeight;count++;if(count>=maxLines)return y;}else line+=ch;}if(line){ctx.fillText(line,x,y);y+=lineHeight;}return y;}
function poster(){const ans=state.demo?SAMPLE:state.answers,data=scoreData(ans),profile=personality(data,ans),[a,b]=data.ordered,canvas=document.createElement('canvas');canvas.width=900;canvas.height=1450;const ctx=canvas.getContext('2d');const gr=ctx.createLinearGradient(0,0,900,1450);gr.addColorStop(0,'#f5e8ff');gr.addColorStop(.5,'#fff7fc');gr.addColorStop(1,'#e9dcff');ctx.fillStyle=gr;ctx.fillRect(0,0,900,1450);const pill=(x,y,w,h)=>{ctx.fillStyle='#ffffffca';ctx.beginPath();ctx.roundRect(x,y,w,h,24);ctx.fill()};pill(60,70,780,1310);ctx.textAlign='center';ctx.fillStyle='#a07dc1';ctx.font='bold 26px sans-serif';ctx.fillText('LOVE LAB · 心动偏爱研究所',450,152);ctx.font='68px sans-serif';ctx.fillText('💌',450,247);ctx.fillStyle='#7454aa';ctx.font='bold 46px sans-serif';ctx.fillText('我的心动关键词',450,337);ctx.font='bold 41px sans-serif';ctx.fillText(a.name+'×'+b.name,450,404);ctx.textAlign='left';ctx.font='bold 29px sans-serif';ctx.fillStyle='#8d73af';ctx.fillText('♡ 六大特性优先序',112,495);let yy=560;data.ordered.forEach((x,i)=>{ctx.font='bold 24px sans-serif';ctx.fillStyle='#6e5595';ctx.fillText(String(i+1).padStart(2,'0')+'  '+x.name,117,yy);ctx.textAlign='right';ctx.fillText(x.score+'分',780,yy);ctx.textAlign='left';ctx.fillStyle='#e9ddf6';ctx.beginPath();ctx.roundRect(118,yy+20,650,10,8);ctx.fill();ctx.fillStyle=i<3?'#a884dc':'#c1a9da';ctx.beginPath();ctx.roundRect(118,yy+20,650*x.score/100,10,8);ctx.fill();yy+=93});ctx.fillStyle='#7653ac';ctx.font='bold 28px sans-serif';ctx.fillText(profile.heading,112,1150);ctx.font='22px sans-serif';ctx.fillStyle='#806a93';wrapCanvas(ctx,profile.desc,112,1202,666,38,4);ctx.textAlign='center';ctx.font='20px sans-serif';ctx.fillStyle='#a08ab4';ctx.fillText('36道趣味情境题 · 仅供娱乐与自我探索',450,1345);try{canvas.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='我的心动偏好-'+(new Date().toISOString().slice(0,10))+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)},'image/png')}catch(e){alert('生成分享图遇到问题，请尝试截图保存。');}}
app.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const act=t.dataset.action;switch(act){case'start':start();break;case'demo':report(true);break;case'home':home();break;case'answer':answer(Number(t.dataset.value));break;case'next':advance();break;case'prev':if(state.idx>0){advanceToken++;state.idx--;persist();quiz();window.scrollTo({top:0,behavior:'instant'});}break;case'poster':poster();break;case'print':window.print();break;}});
if(state.done)report(false);else home();
